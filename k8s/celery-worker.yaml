apiVersion: apps/v1
kind: Deployment

metadata:
  name: celery-worker

spec:
  replicas: 2

  selector:
    matchLabels:
      app: celery-worker

  template:

    metadata:
      labels:
        app: celery-worker

    spec:

      containers:
        - name: celery-worker

          image: qa-agent-api:latest