apiVersion: apps/v1
kind: Deployment

metadata:
  name: qa-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: qa-api

  template:

    metadata:
      labels:
        app: qa-api

    spec:

      containers:
        - name: qa-api

          image: qa-agent-api:latest

          imagePullPolicy: Never

          ports:
            - containerPort: 8000