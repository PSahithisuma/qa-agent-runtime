apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:

    metadata:
      labels:
        app: postgres

    spec:

      containers:
        - name: postgres

          image: postgres:16

          env:
            - name: POSTGRES_USER
              value: qa_user

            - name: POSTGRES_PASSWORD
              value: qa_password

            - name: POSTGRES_DB
              value: qa_runtime

          ports:
            - containerPort: 5432